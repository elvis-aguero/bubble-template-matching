[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "bubble-histogram"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scikit-image",
    "Pillow",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[tool.setuptools]
packages = ["bubble_histogram"]

[tool.pytest.ini_options]
testpaths = ["tests"]
